name: conformance

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test C
        run: |
          cmake -S c -B build/c
          cmake --build build/c
          ctest --test-dir build/c --output-on-failure
      - name: Build and test C++
        run: |
          cmake -S cpp -B build/cpp
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test Java artifact
        run: mvn --batch-mode clean verify
      - name: Upload Java artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mqtt-sn-2-java-client
          path: |
            java/target/mqtt-sn-2-client-*.jar
            java-bouncycastle/target/mqtt-sn-2-client-protection-bc-*.jar
            !java/target/original-*.jar
            !java-bouncycastle/target/original-*.jar

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Test Python
        working-directory: python
        run: |
          python -m pip install --only-binary=:all: "pytest==8.4.2" "cryptography==50.0.2"
          PYTHONPATH=src python -m pytest

  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile buffer client example
        run: |
          arduino-cli compile             --fqbn arduino:avr:uno             --library arduino             arduino/examples/BufferClient

  wireshark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: ["ubuntu:24.04", "debian:trixie"]
    container: ${{ matrix.container }}
    steps:
      - name: Install capture test tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 tshark
          # Containers run as root; enable scripts only in this test container.
          lua_dir=$(tshark -G folders | sed -n 's/^Global Lua Plugins:[[:space:]]*//p')
          test -n "$lua_dir"
          mkdir -p "$lua_dir"
          printf '%s\n' 'run_user_scripts_when_superuser = true' > "$lua_dir/init.lua"
          tshark --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test MQTT-SN 2.0 dissector with tshark
        run: python3 -m unittest discover -s wireshark/tests -v
