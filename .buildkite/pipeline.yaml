steps:
  - label: ":java: Build MQTT-SN 2.0 Java client"
    key: "java-build"
    checkout:
      ssh_secret: "GITHUB_SSH_KEY"
    commands:
      - "export SONAR_TOKEN=$(buildkite-agent secret get SONAR_TOKEN)"
      - "mvn --batch-mode clean verify"
      - "mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.token=${SONAR_TOKEN} -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=maps-messaging -Dsonar.projectKey=Maps-Messaging_mqtt-sn-2.0-client"
    artifact_paths:
      - "java/target/mqtt-sn-2-client-*.jar"
      - "java-bouncycastle/target/mqtt-sn-2-client-protection-bc-*.jar"
    agents:
      queue: "java_build_queue_aws"

  - label: ":nexus: Publish MQTT-SN 2.0 snapshot"
    key: "publish-snapshot"
    depends_on: "java-build"
    if: build.branch == "development" && build.tag == null
    checkout:
      ssh_secret: "GITHUB_SSH_KEY"
    commands:
      - 'grep -Eq "<version>[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT</version>" pom.xml && grep -Eq "<version>[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT</version>" java/pom.xml && grep -Eq "<version>[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT</version>" java-bouncycastle/pom.xml || { echo "Refusing to deploy non-SNAPSHOT Maven modules" >&2; exit 1; }'
      - "mvn --batch-mode clean deploy -DskipTests"
    agents:
      queue: "java_build_queue_aws"
